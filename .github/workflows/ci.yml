# Kassandra CI — run the full test suite on every pull request (and on master).
#
# Lanes (all triggered on PRs):
#   build      — compile the SBF program (.so) ONCE and share it as an artifact.
#                Every downstream lane's tests load this exact .so
#                (`target/deploy/kassandra_markets_program.so`): the Rust program tests
#                `include_bytes!` it at compile time; the SDK litesvm + surfpool
#                harnesses load it at runtime.
#   rust       — `cargo test --workspace` (program LiteSVM tests + rust SDK + indexer).
#   js         — build the SDK (the app consumes its dist/), then typecheck + lint
#                + every vitest suite for sdk & app. The sdk litesvm suites need the
#                shared .so; surfpool-gated suites self-skip (`describe.skipIf`).
#   gpt-oracle-e2e — load the tracked MagicBlock solana-gpt-oracle ELF, build
#                `llm_oracle` from a pinned SHA, and drive RequestAi → callback
#                through a LOCAL MOCK OpenRouter (no live API).
#   e2e        — boot a local surfpool validator + run the Playwright browser
#                suite (market create/trade/resolve against the real program).

name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pin the Anza (Agave) toolchain that builds the SBF program locally, for a
  # reproducible `cargo build-sbf`.
  SOLANA_VERSION: v3.1.7

jobs:
  build:
    name: Build · SBF program (.so)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: Cache Solana toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
          key: solana-${{ env.SOLANA_VERSION }}-${{ runner.os }}

      - name: Install Solana (Anza) toolchain
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Build SBF program (.so) — markets
        run: cargo build-sbf --manifest-path programs/markets/Cargo.toml

      - name: Upload program artifacts
        uses: actions/upload-artifact@v4
        with:
          name: program-so
          path: target/deploy/kassandra_markets_program.so
          if-no-files-found: error
          retention-days: 1

  rust:
    name: Rust · program + rust SDK + indexer
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: Download program artifact
        uses: actions/download-artifact@v4
        with:
          name: program-so
          path: target/deploy

      # The program's LiteSVM tests `include_bytes!` the .so at COMPILE time, so it
      # must exist at target/deploy/ before `cargo test` builds the test binaries.
      - name: Run workspace tests
        run: cargo test --workspace

  js:
    name: TS · build · typecheck · lint · unit
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Download program artifact
        uses: actions/download-artifact@v4
        with:
          name: program-so
          path: target/deploy

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Single-source versioning: every TS SDK package.json must match the Rust
      # workspace [workspace.package].version. A Cargo bump without re-running
      # `make version-sync` fails here.
      - name: Version parity (workspace ↔ TS SDKs)
        run: node scripts/sync-version.mjs --check

      # The app consumes the markets SDK via its built dist/ (package `exports`).
      - name: Build markets SDK
        run: pnpm --filter @kassandra-market/markets build

      - name: SDK tests (litesvm + decoders)
        # The market SDK's litesvm suite crashes (napi bad_alloc) on hosted linux,
        # so it self-skips under SKIP_LITESVM (mirrors the kassandra-market CI).
        run: SKIP_LITESVM=1 pnpm --filter @kassandra-market/markets test

      - name: SDK typecheck
        run: pnpm --filter @kassandra-market/markets typecheck

      - name: App typecheck
        run: pnpm --filter ./app typecheck

      - name: App lint
        run: pnpm --filter ./app lint

      - name: App unit tests
        run: pnpm --filter ./app test

  gpt-oracle-e2e:
    name: E2E · GPT oracle + mock OpenRouter (offline)
    needs: build
    runs-on: ubuntu-latest
    env:
      GPT_ORACLE_SHA: 96f1143f86cb83ec3df98bae29df7b7c8a9f92f2
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: Cache llm_oracle clone + target
        uses: actions/cache@v4
        with:
          path: /tmp/solana-gpt-oracle-${{ env.GPT_ORACLE_SHA }}
          key: llm-oracle-${{ env.GPT_ORACLE_SHA }}-${{ runner.os }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install surfpool
        env:
          SURFPOOL_VERSION: v1.4.0
        run: |
          curl -fsSL "https://github.com/txtx/surfpool/releases/download/${SURFPOOL_VERSION}/surfpool-linux-x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin surfpool
          sudo chmod +x /usr/local/bin/surfpool
          surfpool --version

      - name: Download program artifact
        uses: actions/download-artifact@v4
        with:
          name: program-so
          path: target/deploy

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build markets TS SDK
        run: pnpm --filter @kassandra-market/markets build

      # Clone the pinned MagicBlock SHA, patch OPENROUTER_API_URL + test identity,
      # and build the host keeper. Does NOT rebuild the SBF fixture (that is
      # committed and loaded by the test). OpenRouter is mocked at runtime.
      - name: Build llm_oracle (OpenRouter mocked at runtime)
        run: |
          chmod +x scripts/vendor-solana-gpt-oracle.sh
          ./scripts/vendor-solana-gpt-oracle.sh --llm-oracle-only | tee /tmp/vendor-llm-oracle.log
          grep '^LLM_ORACLE_BIN=' /tmp/vendor-llm-oracle.log >> "$GITHUB_ENV"

      - name: Run GPT-oracle surfpool e2e (mock OpenRouter)
        run: pnpm --filter @kassandra-market/markets exec vitest run test/surfpool/gpt-oracle-e2e.test.ts
        env:
          KASSANDRA_MARKET_E2E: "1"
          SURFPOOL_BIN: /usr/local/bin/surfpool

  e2e:
    name: E2E · surfpool + Playwright (browser)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # surfpool (the local Solana simnet the e2e harness boots). Pinned to the
      # GitHub release the harness was validated against (see NOTES-surfpool.md).
      # The snap `latest` channel is stale — it serves 0.9.5, whose `--version`
      # even exits non-zero, and it predates the 1.0.0 boot behavior the harness
      # relies on. Bump SURFPOOL_VERSION deliberately, re-checking the harness.
      # v1.4.0: adds a working websocket `programSubscribe` (v1.0.0 stubbed it as
      # "unimplemented"), so the indexer's live account tail works on simnet.
      - name: Install surfpool
        env:
          SURFPOOL_VERSION: v1.4.0
        run: |
          curl -fsSL "https://github.com/txtx/surfpool/releases/download/${SURFPOOL_VERSION}/surfpool-linux-x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin surfpool
          sudo chmod +x /usr/local/bin/surfpool
          surfpool --version

      - name: Download program artifact
        uses: actions/download-artifact@v4
        with:
          name: program-so
          path: target/deploy

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build markets SDK
        run: pnpm --filter @kassandra-market/markets build

      - name: Install Playwright Chromium
        run: pnpm --filter ./app exec playwright install --with-deps chromium

      - name: Run browser E2E (local simnet)
        run: pnpm --filter ./app exec playwright test
        env:
          SURFPOOL_BIN: /usr/local/bin/surfpool

  # The indexer (playwright.indexer.config.ts) and candle
  # (playwright.candles.config.ts) browser suites need EXTRA infra the default
  # `e2e` job lacks — an ephemeral Postgres + the real kassandra-indexer binary
  # (and, for candles, surfpool's websocket) — so they run here as separate steps
  # rather than being swept into (or excluded-and-forgotten by) the default run.
  e2e-indexer:
    name: E2E · indexer + candles (Postgres)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install surfpool
        env:
          SURFPOOL_VERSION: v1.4.0
        run: |
          curl -fsSL "https://github.com/txtx/surfpool/releases/download/${SURFPOOL_VERSION}/surfpool-linux-x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin surfpool
          sudo chmod +x /usr/local/bin/surfpool
          surfpool --version

      # The e2e harness stands up throwaway Postgres clusters via initdb/pg_ctl
      # (app/e2e/indexer/pg.ts); ubuntu-latest ships the PostgreSQL 16 binaries but
      # not on PATH — export their dir so pg.ts finds them.
      - name: Locate PostgreSQL binaries
        run: |
          PG_BIN="$(dirname "$(ls /usr/lib/postgresql/*/bin/initdb | sort -V | tail -1)")"
          echo "PG_BIN=$PG_BIN" >> "$GITHUB_ENV"
          "$PG_BIN/initdb" --version

      - name: Download program artifact
        uses: actions/download-artifact@v4
        with:
          name: program-so
          path: target/deploy

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Both suites run the REAL indexer binary from the workspace target dir.
      - name: Build indexer binary
        run: cargo build --release --locked -p kassandra-indexer

      - name: Build markets SDK
        run: pnpm --filter @kassandra-market/markets build

      - name: Install Playwright Chromium
        run: pnpm --filter ./app exec playwright install --with-deps chromium

      - name: Run indexer E2E (surfpool + Postgres + indexer)
        run: pnpm --filter ./app exec playwright test --config=playwright.indexer.config.ts
        env:
          SURFPOOL_BIN: /usr/local/bin/surfpool

      - name: Run candle E2E (surfpool ws + Postgres + indexer + chart)
        run: pnpm --filter ./app exec playwright test --config=playwright.candles.config.ts
        env:
          SURFPOOL_BIN: /usr/local/bin/surfpool

  db-it:
    name: Indexer · Postgres integration
    runs-on: ubuntu-latest
    # The db-layer tests run the REAL Postgres-specific SQL (JSONB, ANY($1) arrays,
    # $N placeholders, ON CONFLICT … EXCLUDED) against a throwaway Postgres service —
    # a SQLite stand-in would exercise a rewritten query. They self-skip everywhere
    # else (no TEST_DATABASE_URL), so this is the only job that needs a database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      # Compiles only the indexer (no .so needed); the db integration test runs
      # against the service Postgres, every other indexer test runs as usual.
      - name: Indexer tests against real Postgres
        run: cargo test -p kassandra-indexer
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
